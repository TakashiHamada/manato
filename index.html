<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manatoアプリケーション">
    <title>Manato App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Manato App</h1>
            <p class="subtitle">GitHub Pagesで動作するアプリケーション</p>
        </header>

        <main>
            <section class="game-section">
                <h2>射的ゲーム</h2>
                <div class="game-container">
                    <canvas id="shootingCanvas" width="480" height="400"></canvas>
                    <div class="game-controls">
                        <button id="startButton" class="primary-button">スタート</button>
                        <button id="pauseButton" class="secondary-button">一時停止</button>
                        <button id="resetButton" class="secondary-button">リセット</button>
                    </div>
                    <div class="game-info">
                        <div class="info-item">
                            <span class="info-label">スコア:</span>
                            <span id="score" class="info-value">0</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">残り弾数:</span>
                            <span id="bullets" class="info-value">10</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">ミス:</span>
                            <span id="missed" class="info-value">0/10</span>
                        </div>
                    </div>
                    <p class="game-instructions">
                        ← → キー、マウス、またはタッチで移動。スペースキーまたはクリック/タップで射撃！
                    </p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Manato App</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
