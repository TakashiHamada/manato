<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manatoアプリケーション">
    <title>Manato App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Manato App</h1>
            <p class="subtitle">GitHub Pagesで動作するアプリケーション</p>
        </header>

        <main>
            <section class="welcome-section">
                <h2>ようこそ</h2>
                <p>このページは、Manatoアプリケーションの土台となるページです。</p>
                <p>ここから様々な機能を追加できます。</p>
            </section>

            <section class="demo-section">
                <h2>デモ機能</h2>
                <div class="demo-controls">
                    <button id="demoButton" class="primary-button">クリックしてみてください</button>
                    <p id="demoOutput" class="output"></p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Manato App</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
