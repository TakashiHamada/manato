<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manatoアプリケーション">
    <title>Manato App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Manato App</h1>
            <p class="subtitle">GitHub Pagesで動作するアプリケーション</p>
        </header>

        <main>
            <section class="welcome-section">
                <h2>ようこそ</h2>
                <p>このページは、Manatoアプリケーションの土台となるページです。</p>
                <p>ここから様々な機能を追加できます。</p>
            </section>

            <section class="demo-section">
                <h2>デモ機能</h2>
                <div class="demo-controls">
                    <button id="demoButton" class="primary-button">クリックしてみてください</button>
                    <p id="demoOutput" class="output"></p>
                </div>
            </section>

            <section class="game-section">
                <h2>ブロック崩しゲーム</h2>
                <div class="game-container">
                    <canvas id="breakoutCanvas" width="480" height="400"></canvas>
                    <div class="game-controls">
                        <button id="startButton" class="primary-button">スタート</button>
                        <button id="pauseButton" class="secondary-button">一時停止</button>
                        <button id="resetButton" class="secondary-button">リセット</button>
                    </div>
                    <div class="game-info">
                        <div class="info-item">
                            <span class="info-label">スコア:</span>
                            <span id="score" class="info-value">0</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">ライフ:</span>
                            <span id="lives" class="info-value">3</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">レベル:</span>
                            <span id="level" class="info-value">1</span>
                        </div>
                    </div>
                    <p class="game-instructions">
                        ← → キー、マウス、またはタッチでパドルを操作してボールを打ち返そう！
                    </p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Manato App</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
